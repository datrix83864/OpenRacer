<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>OpenRacer - Ski Race Timing System</title>

    <!-- Styles -->
    <link rel="stylesheet" href="ui/styles/theme.css">
    <link rel="stylesheet" href="ui/styles/timing.css">
    <link rel="stylesheet" href="ui/styles/results.css">

    <!-- UI Components -->
    <script src="ui/components/timing-panel.js"></script>
    <script src="ui/components/dual-timing-panel.js"></script>
    <script src="ui/components/leaderboard.js"></script>
    <script src="ui/components/racer-list.js"></script>

    <style>
        /* App shell — layout only; component styles live in timing.css / results.css */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header ──────────────────────────────────────────────────────── */
        .header {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-primary);
            padding: var(--spacing-sm) var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-app-region: drag;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--font-weight-bold);
            font-size: var(--font-size-md);
            color: white;
        }

        .app-version {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            margin-left: var(--spacing-xs);
        }

        .header-right {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            -webkit-app-region: no-drag;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-xs) var(--spacing-sm);
            background: var(--bg-input);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
        }

        /* ── Main area ───────────────────────────────────────────────────── */
        .main-area {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* Tab panels fill remaining height */
        #tab-timing,
        #tab-results,
        #tab-racers {
            padding: 0;
        }

        #timingPanelContainer {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: var(--spacing-lg);
            box-sizing: border-box;
        }

        /* ── Update modal ────────────────────────────────────────────────── */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: var(--z-modal);
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 500px;
            width: 90%;
        }

        .modal-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
            margin-top: var(--spacing-lg);
            flex-wrap: wrap;
        }

        /* ── Notification ────────────────────────────────────────────────── */
        .notification {
            position: fixed;
            top: 80px;
            right: var(--spacing-lg);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            min-width: 300px;
            max-width: 420px;
            box-shadow: var(--shadow-xl);
            display: none;
            z-index: var(--z-notification);
        }

        .notification.active {
            display: block;
            animation: slideIn var(--transition-slow);
        }

        .notification-title {
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-xs);
        }

        .notification-body {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">OR</div>
            <div>
                <span class="text-xl font-semibold">OpenRacer</span>
                <span class="app-version" id="version">v1.0.0</span>
            </div>
        </div>
        <div class="header-right">
            <div class="status-badge">
                <div class="status-indicator online" id="statusDot"></div>
                <span id="statusText">Checking…</span>
            </div>
            <button class="btn btn-secondary btn-sm" id="checkUpdateBtn">Check Updates</button>
        </div>
    </header>

    <!-- Tab bar -->
    <nav class="tab-bar">
        <button class="tab-btn active" data-tab="timing">Timing</button>
        <button class="tab-btn"        data-tab="results">Results</button>
        <button class="tab-btn"        data-tab="racers">Racers</button>
    </nav>

    <!-- Main area -->
    <div class="main-area">

        <!-- Timing tab -->
        <div id="tab-timing" class="tab-panel active">
            <div id="timingPanelContainer"></div>
        </div>

        <!-- Results / leaderboard tab -->
        <div id="tab-results" class="tab-panel">
            <div id="leaderboardContainer" style="display:flex;flex-direction:column;height:100%;"></div>
        </div>

        <!-- Racers tab -->
        <div id="tab-racers" class="tab-panel">
            <div id="racerListContainer" style="display:flex;flex-direction:column;height:100%;"></div>
        </div>

    </div>

</div>

<!-- Update modal -->
<div class="modal" id="updateModal">
    <div class="modal-content">
        <h2 class="text-2xl font-bold mb-md">Update Available</h2>
        <div class="text-base text-secondary" id="updateBody">A new version of OpenRacer is available.</div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="skipVersionBtn">Skip This Version</button>
            <button class="btn btn-secondary" id="remindLaterBtn">Remind Me Later</button>
            <button class="btn btn-secondary" id="downloadBackgroundBtn">Download in Background</button>
            <button class="btn btn-primary"   id="downloadNowBtn">Download Now</button>
        </div>
    </div>
</div>

<!-- Notification toast -->
<div class="notification" id="notification">
    <div class="notification-title" id="notificationTitle">Notification</div>
    <div class="notification-body"  id="notificationBody">Message</div>
</div>

<script src="renderer.js"></script>
</body>
</html>
